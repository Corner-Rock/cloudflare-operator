name: release

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"
  workflow_dispatch:
  pull_request:
    branches:
      - "main"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: cloudflare-operator

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase image owner
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=cloudflare-operator
            org.opencontainers.image.description=Kubernetes operator for Cloudflare Tunnels and DNS
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup Go 1.24
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/setup-go@v5
        with:
          go-version: 1.27

      - name: Build installer
        if: startsWith(github.ref, 'refs/tags/')
        run: make build-installer VERSION="${GITHUB_REF_NAME#v}" IMAGE_TAG_BASE="${REGISTRY}/${{ steps.owner.outputs.value }}/${IMAGE_NAME}"

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          release_args=(
            "${GITHUB_REF_NAME}"
            --title "${GITHUB_REF_NAME}"
            --generate-notes
          )
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${release_args[@]}"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish installer assets
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release upload ${{ github.ref_name }} dist/*.yaml
        env:
          GH_TOKEN: ${{ github.token }}
