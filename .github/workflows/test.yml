name: test

on:
  push:
    branches:
      - "main"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: 1.27
      - name: Test
        run: make test
      - name: Archive code coverage results
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage
          path: cover.out
  code_coverage:
    name: "Code coverage report"
    if: github.event.pull_request.head.repo.full_name == github.repository # run only when the PR’s branch lives in this repo
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents:      read
      actions:       read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      # The report diffs against the last successful push run on main, and the
      # action fails hard when there is none yet.
      - name: Check for a baseline run on main
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh run list --status=success --branch=main --workflow=test.yml --event=push --json=databaseId --limit=1 -q '.[] | .databaseId')
          echo "exists=$([ -n "$id" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: fgrosse/go-coverage-report@v1.1.1
        if: steps.baseline.outputs.exists == 'true'
        with:
          coverage-artifact-name: "code-coverage"
          coverage-file-name: "cover.out"
